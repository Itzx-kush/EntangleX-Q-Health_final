name: Live Hybrid Runtime Verification

on:
  push:
    branches:
      - "feat/live-hybrid-runtime-verification-20261005"
  pull_request:
    branches:
      - main
      - "feat/live-hybrid-runtime-verification-20261005"

permissions:
  contents: read

jobs:
  backend-hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      QHEALTH_STORAGE_ROOT: ${{ runner.temp }}/qhealth-runtime
      QHEALTH_DEPLOYMENT_MODE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Targeted live hybrid verification
        run: python scripts/verify_hybrid_runtime.py
      - name: Existing flagship regression tests
        run: pytest -q tests/test_sih_alignment.py tests/test_verified_demo_readiness.py tests/test_thresholds_and_evidence.py tests/test_security_storage.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Existing frontend tests
        run: npm test -- --run
      - name: Production build
        run: npm run build
