<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" role="img" aria-label="EntangleX">
<defs>
  <linearGradient id="xg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#21d9ff"/>
    <stop offset=".5" stop-color="#5f8cff"/>
    <stop offset="1" stop-color="#d044ff"/>
  </linearGradient>
  <linearGradient id="og" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#20d9ff"/>
    <stop offset=".48" stop-color="#6b72ff"/>
    <stop offset="1" stop-color="#e14cff"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="80" font-weight="600" letter-spacing="-3">
  <text x="4" y="103" fill="#171b26">Entangle</text>
</g>
<g transform="translate(385 76)" filter="url(#soft)">
  <ellipse rx="112" ry="38" fill="none" stroke="url(#og)" stroke-width="3" transform="rotate(-27)"/>
  <ellipse rx="102" ry="35" fill="none" stroke="url(#og)" stroke-width="2.2" opacity=".72" transform="rotate(30)"/>
  <text x="-12" y="28" text-anchor="middle" fill="url(#xg)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="104" font-weight="700" letter-spacing="-8">X</text>
  <circle cx="-48" cy="-8" r="12" fill="#38d7ff"/>
  <circle cx="48" cy="15" r="10" fill="#9d58ff"/>
</g>
</svg>