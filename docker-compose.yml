services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      QHEALTH_STORAGE_ROOT: /runtime
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - qhealth_data:/runtime
    restart: unless-stopped
    init: true
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 20s
      timeout: 7s
      retries: 5
      start_period: 20s
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
volumes:
  qhealth_data:
